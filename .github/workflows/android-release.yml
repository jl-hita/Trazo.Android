name: Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-play-release
  cancel-in-progress: false

jobs:
  publish-closed-testing:
    name: Build, sign and publish AAB
    runs-on: ubuntu-latest
    steps:
      - name: Check publication secrets
        id: secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TRAZO_SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TRAZO_SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TRAZO_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TRAZO_SIGNING_KEY_PASSWORD }}
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          API_BASE_URL: ${{ secrets.TRAZO_API_BASE_URL }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.TRAZO_GOOGLE_WEB_CLIENT_ID }}
          DIAGNOSTICS_KEY: ${{ secrets.TRAZO_DIAGNOSTICS_UPLOAD_KEY }}
        run: |
          missing=()
          [[ -n "$KEYSTORE_BASE64" ]] || missing+=("TRAZO_SIGNING_KEYSTORE_BASE64")
          [[ -n "$KEYSTORE_PASSWORD" ]] || missing+=("TRAZO_SIGNING_KEYSTORE_PASSWORD")
          [[ -n "$KEY_ALIAS" ]] || missing+=("TRAZO_SIGNING_KEY_ALIAS")
          [[ -n "$KEY_PASSWORD" ]] || missing+=("TRAZO_SIGNING_KEY_PASSWORD")
          [[ -n "$PLAY_JSON" ]] || missing+=("GOOGLE_PLAY_SERVICE_ACCOUNT_JSON")
          [[ -n "$API_BASE_URL" ]] || missing+=("TRAZO_API_BASE_URL")
          [[ -n "$GOOGLE_WEB_CLIENT_ID" ]] || missing+=("TRAZO_GOOGLE_WEB_CLIENT_ID")
          if [[ -n "$API_BASE_URL" && ! "$API_BASE_URL" =~ ^https:// ]]; then
            echo "TRAZO_API_BASE_URL debe comenzar por https://"
            exit 1
          fi
          if [[ -n "$DIAGNOSTICS_KEY" ]]; then
            echo "mapping_upload_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "mapping_upload_ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TRAZO_DIAGNOSTICS_UPLOAD_KEY no está configurado; el mapping R8 de esta versión no se enviará al backend."
            echo "⚠️ **Mapping R8 no subido:** configura el secret TRAZO_DIAGNOSTICS_UPLOAD_KEY para que los tickets Android de esta versión puedan desofuscarse automáticamente." >> "$GITHUB_STEP_SUMMARY"
          fi
          if (( ${#missing[@]} )); then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Publicación omitida. Faltan secrets: ${missing[*]}"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Java
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: steps.secrets.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          gradle-version: "8.13"

      - name: Restore upload keystore
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TRAZO_SIGNING_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/trazo-upload.jks"
          chmod 600 "$RUNNER_TEMP/trazo-upload.jks"

      - name: Build signed release bundle
        id: build
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        env:
          TRAZO_SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/trazo-upload.jks
          TRAZO_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.TRAZO_SIGNING_KEYSTORE_PASSWORD }}
          TRAZO_SIGNING_KEY_ALIAS: ${{ secrets.TRAZO_SIGNING_KEY_ALIAS }}
          TRAZO_SIGNING_KEY_PASSWORD: ${{ secrets.TRAZO_SIGNING_KEY_PASSWORD }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          TRAZO_API_BASE_URL: ${{ secrets.TRAZO_API_BASE_URL }}
          TRAZO_GOOGLE_WEB_CLIENT_ID: ${{ secrets.TRAZO_GOOGLE_WEB_CLIENT_ID }}
        run: |
          # 30002 is the last known Play versionCode. Each run of this workflow gets a unique higher code.
          VERSION_CODE=$((30002 + GITHUB_RUN_NUMBER))
          VERSION_NAME="$(sed -n 's/^[[:space:]]*val appVersionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          [[ -n "$VERSION_NAME" ]] || { echo "Could not determine appVersionName"; exit 1; }
          APP_VERSION="${VERSION_NAME}+${VERSION_CODE}"
          echo "Building Trazo version $APP_VERSION"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          gradle --no-daemon :app:testDebugUnitTest :app:bundleRelease \
            -PversionCode="$VERSION_CODE" \
            -PapiBaseUrl="$TRAZO_API_BASE_URL" \
            -PgoogleWebClientId="$TRAZO_GOOGLE_WEB_CLIENT_ID"

      - name: Upload R8 mapping to the diagnostics API
        if: steps.secrets.outputs.ready == 'true' && steps.secrets.outputs.mapping_upload_ready == 'true'
        shell: bash
        env:
          TRAZO_API_BASE_URL: ${{ secrets.TRAZO_API_BASE_URL }}
          TRAZO_DIAGNOSTICS_UPLOAD_KEY: ${{ secrets.TRAZO_DIAGNOSTICS_UPLOAD_KEY }}
          APP_VERSION: ${{ steps.build.outputs.app_version }}
        run: |
          set -euo pipefail
          API_BASE_URL="${TRAZO_API_BASE_URL%/}"
          ENCODED_VERSION="${APP_VERSION//+/%2B}"
          curl --fail --silent --show-error \
            -H "X-Trazo-Diagnostics-Key: $TRAZO_DIAGNOSTICS_UPLOAD_KEY" \
            -H "Content-Type: text/plain" \
            --data-binary "@app/build/outputs/mapping/release/mapping.txt" \
            "$API_BASE_URL/api/internal/diagnostics/mappings?appVersion=$ENCODED_VERSION"

      - name: Preserve AAB and R8 mapping
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trazo-release-${{ github.run_number }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish to Google Play closed testing
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_STORE_TRACK: ${{ vars.PLAY_STORE_TRACK }}
        run: |
          set -euo pipefail
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/google-play-service-account.json"
          chmod 600 "$RUNNER_TEMP/google-play-service-account.json"
          TRACK="${PLAY_STORE_TRACK:-alpha}"
          # Install Fastlane into an isolated runner-local gem home and add its bin directory to PATH.
          export GEM_HOME="$RUNNER_TEMP/fastlane-gems"
          gem install fastlane --no-document --install-dir "$GEM_HOME" --bindir "$GEM_HOME/bin"
          export PATH="$GEM_HOME/bin:$PATH"
          fastlane supply \
            --aab app/build/outputs/bundle/release/app-release.aab \
            --package_name com.trazo.android \
            --track "$TRACK" \
            --json_key "$RUNNER_TEMP/google-play-service-account.json" \
            --skip_upload_metadata true \
            --skip_upload_images true \
            --skip_upload_screenshots true
