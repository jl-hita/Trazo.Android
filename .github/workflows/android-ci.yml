name: Android CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with: { gradle-version: "8.13" }
      - run: gradle --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease
  instrumented:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with: { gradle-version: "8.13" }
      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests on an emulator
        run: |
          # The signed-in screens are tested against the mock API; the emulator reaches the runner at 10.0.2.2.
          python3 tools/mock-api/server.py --lang en --port 8099 > "$RUNNER_TEMP/mock-api.log" 2>&1 &
          curl --silent --output /dev/null --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:8099/
          gradle --no-daemon :app:pixelApi34DebugAndroidTest -PapiBaseUrl=http://10.0.2.2:8099/ -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
